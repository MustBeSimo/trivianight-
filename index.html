<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trivia Night Scoreboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>Trivia Night Scoreboard</h1>
      <p>Track every team and update scores live during the game.</p>
    </header>

    <section class="card controls">
      <form id="team-form" class="team-form" autocomplete="off">
        <label>
          Team name
          <input id="team-name" type="text" placeholder="e.g., Brainiacs" required />
        </label>
        <button type="submit">Add team</button>
      </form>

      <div class="score-buttons" aria-label="Score quick add">
        <p>Quick score update:</p>
        <button data-points="1" type="button">+1</button>
        <button data-points="2" type="button">+2</button>
        <button data-points="5" type="button">+5</button>
        <button data-points="-1" type="button">-1</button>
      </div>
    </section>

    <section class="card">
      <div class="table-header">
        <h2>Standings</h2>
        <button id="reset-scores" type="button" class="danger">Reset all</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Team</th>
            <th>Score</th>
            <th>Update</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="teams-table-body"></tbody>
      </table>
      <p id="empty-state" class="empty">No teams yet. Add one to start the game.</p>
    </section>
  </main>

  <template id="team-row-template">
    <tr>
      <td data-field="rank"></td>
      <td data-field="name"></td>
      <td data-field="score"></td>
      <td>
        <input data-field="custom-points" type="number" value="1" aria-label="points" />
      </td>
      <td class="actions">
        <button data-action="add" type="button">Add</button>
        <button data-action="subtract" type="button">Subtract</button>
        <button data-action="remove" type="button" class="danger">Remove</button>
      </td>
    </tr>
  </template>

  <script src="script.js"></script>
</body>
</html>
